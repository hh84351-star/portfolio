<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#121212"/>
  
  <g transform="translate(250, 50)">
    <!-- Vertical Video Frame -->
    <rect x="0" y="0" width="300" height="500" rx="20" fill="#1e1e1e" stroke="#2d5a3f" stroke-width="3"/>
    
    <!-- Screen -->
    <rect x="15" y="15" width="270" height="470" rx="12" fill="#0d1f14"/>
    
    <!-- Play Button Icon -->
    <circle cx="150" cy="220" r="40" fill="#2d5a3f" opacity="0.9"/>
    <polygon points="142,204 166,220 142,236" fill="#a3e635"/>
    
    <text x="150" y="300" font-family="Pretendard, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">AI SHORT-FORM REEL</text>
    <text x="150" y="324" font-family="Pretendard, sans-serif" font-size="12" fill="#a8d5ba" text-anchor="middle">AI Avatar &amp; Voice Synthesis</text>
    
    <!-- Timeline Bar -->
    <rect x="30" y="440" width="240" height="4" rx="2" fill="#333333"/>
    <rect x="30" y="440" width="140" height="4" rx="2" fill="#a3e635"/>
    <circle cx="170" cy="442" r="6" fill="#a3e635"/>
  </g>
</svg>
