<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="aiG" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c3b29"/>
      <stop offset="60%" stop-color="#0e1f15"/>
      <stop offset="100%" stop-color="#050a07"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#aiG)"/>
  
  <!-- Modern Geometric AI Artwork Poster -->
  <g transform="translate(200, 50)">
    <rect x="0" y="0" width="400" height="500" rx="4" fill="none" stroke="#2d5a3f" stroke-width="2"/>
    
    <!-- AI Circle & Mesh Art -->
    <circle cx="200" cy="220" r="130" fill="none" stroke="#a3e635" stroke-width="1.5" stroke-dasharray="4 8"/>
    <circle cx="200" cy="220" r="90" fill="#2d5a3f" opacity="0.4"/>
    <polygon points="200,110 280,270 120,270" fill="none" stroke="#e8f3ec" stroke-width="2"/>
    <circle cx="200" cy="220" r="24" fill="#a3e635"/>

    <!-- Typography Editorial style -->
    <text x="30" y="60" font-family="Pretendard, sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="4">FUTURE AI POSTER</text>
    <text x="30" y="80" font-family="Pretendard, sans-serif" font-size="10" font-weight="500" fill="#a3e635" letter-spacing="2">MIDJOURNEY / STABLE DIFFUSION</text>

    <text x="30" y="440" font-family="Pretendard, sans-serif" font-size="12" font-weight="700" fill="#ffffff">KEY VISUAL CONCEPT ART</text>
    <text x="30" y="460" font-family="Pretendard, sans-serif" font-size="10" fill="#888888">PROMPT ENGINEERING & POST RETOUCHING</text>
  </g>
</svg>
