<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#f8fdf9"/>
  
  <!-- Presentation Slide Mockup -->
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="600" height="380" rx="12" fill="#ffffff" stroke="#2d5a3f" stroke-width="2" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.06))"/>
    
    <rect x="0" y="0" width="600" height="48" rx="12 12 0 0" fill="#f0f7f2"/>
    <circle cx="30" cy="24" r="6" fill="#ff5f56"/>
    <circle cx="50" cy="24" r="6" fill="#ffbd2e"/>
    <circle cx="70" cy="24" r="6" fill="#27c93f"/>
    <text x="300" y="29" font-family="Pretendard, sans-serif" font-size="12" font-weight="600" fill="#2d5a3f" text-anchor="middle">PRESENTATION DECK &amp; BRANDING</text>

    <!-- Slide Inner Body -->
    <rect x="50" y="90" width="220" height="230" rx="8" fill="#e8f3ec"/>
    <text x="70" y="140" font-family="Pretendard, sans-serif" font-size="20" font-weight="900" fill="#2d5a3f">PITCH DECK</text>
    <text x="70" y="170" font-family="Pretendard, sans-serif" font-size="13" font-weight="600" fill="#555555">사업계획서 · PPT 디자인</text>

    <rect x="300" y="90" width="250" height="100" rx="6" fill="#f4f6f4"/>
    <rect x="300" y="210" width="250" height="110" rx="6" fill="#12261a"/>
    <text x="425" y="270" font-family="Pretendard, sans-serif" font-size="14" font-weight="700" fill="#a3e635" text-anchor="middle">VISUAL INFOGRAPHIC</text>
  </g>

  <text x="100" y="500" font-family="Pretendard, sans-serif" font-size="14" font-weight="700" fill="#121212">KEYNOTE / PRESENTATION DESIGN ARCHIVE</text>
</svg>
