<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#e8f3ec"/>
  
  <g transform="translate(180, 40)">
    <!-- Poster Frame -->
    <rect x="0" y="0" width="440" height="520" rx="8" fill="#ffffff" stroke="#c2dcd0" stroke-width="2" filter="drop-shadow(0 16px 32px rgba(45,90,63,0.08))"/>
    
    <!-- Graphic Elements -->
    <rect x="40" y="40" width="360" height="240" fill="#2d5a3f" rx="4"/>
    <circle cx="220" cy="160" r="70" fill="#a3e635"/>
    <text x="220" y="167" fill="#12261a" font-family="Pretendard, sans-serif" font-size="22" font-weight="900" text-anchor="middle">EXHIBITION</text>

    <!-- Editorial Typography -->
    <text x="40" y="320" font-family="Pretendard, sans-serif" font-size="24" font-weight="900" fill="#121212">GRAPHIC POSTER DESIGN</text>
    <text x="40" y="348" font-family="Pretendard, sans-serif" font-size="13" font-weight="600" fill="#2d5a3f">포스터 · 홍보 리플렛 · 비주얼 아이덴티티</text>
    
    <rect x="40" y="380" width="360" height="1" fill="#e0e0e0"/>
    <rect x="40" y="400" width="120" height="8" rx="4" fill="#888888"/>
    <rect x="40" y="420" width="200" height="8" rx="4" fill="#bbbbbb"/>
    
    <rect x="300" y="440" width="100" height="32" rx="16" fill="#2d5a3f"/>
    <text x="350" y="461" fill="#ffffff" font-family="Pretendard, sans-serif" font-size="12" font-weight="700" text-anchor="middle">VIEW DESIGN</text>
  </g>
</svg>
