<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f6f4"/>
      <stop offset="100%" stop-color="#e3eae4"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#12261a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bgG)"/>
  
  <!-- Content Mockup -->
  <g filter="url(#shadow)">
    <!-- Card Frame 1 -->
    <rect x="120" y="80" width="260" height="440" rx="16" fill="#ffffff"/>
    <rect x="140" y="100" width="220" height="220" rx="8" fill="#e9f2eb"/>
    <circle cx="250" cy="210" r="40" fill="#2d5a3f" opacity="0.8"/>
    <rect x="140" y="340" width="160" height="12" rx="6" fill="#121212"/>
    <rect x="140" y="364" width="200" height="8" rx="4" fill="#888888"/>
    <rect x="140" y="380" width="140" height="8" rx="4" fill="#aaaaaa"/>
    
    <rect x="140" y="420" width="80" height="24" rx="12" fill="#2d5a3f"/>
    <text x="180" y="436" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Pretendard, sans-serif" font-size="11" font-weight="600" text-anchor="middle">CARD 01</text>

    <!-- Card Frame 2 (Overlapping) -->
    <rect x="420" y="120" width="260" height="440" rx="16" fill="#ffffff"/>
    <rect x="440" y="140" width="220" height="220" rx="8" fill="#12261a"/>
    <path d="M 490 270 Q 550 180 610 270" stroke="#a3e635" stroke-width="4" fill="none"/>
    <circle cx="550" cy="210" r="14" fill="#a3e635"/>
    <rect x="440" y="380" width="180" height="12" rx="6" fill="#121212"/>
    <rect x="440" y="404" width="150" height="8" rx="4" fill="#888888"/>
    
    <rect x="440" y="440" width="90" height="24" rx="12" fill="#e8f3ec"/>
    <text x="485" y="456" fill="#2d5a3f" font-family="-apple-system, BlinkMacSystemFont, Pretendard, sans-serif" font-size="11" font-weight="600" text-anchor="middle">INSTAGRAM</text>
  </g>

  <!-- Tag overlay -->
  <text x="40" y="50" font-family="-apple-system, BlinkMacSystemFont, Pretendard, sans-serif" font-size="14" font-weight="700" fill="#2d5a3f" letter-spacing="2">SNS CONTENT ARCHIVE</text>
</svg>
